<!-- web/static/chat.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chat</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/chat.css" />
</head>
<body>
  <div class="container" style="max-width: 1100px;">
    <div class="topbar">
      <h1>Chat</h1>
      <button id="chat-exit" class="ghost-btn">Back</button>
    </div>

    <div class="panel">
      <div class="chat-shell">
        <div class="chat-header">
          <div class="chat-peer">
            <div class="chat-peer-avatar" id="chat-peer-avatar">?</div>
            <div>
              <div class="chat-peer-name" id="chat-peer-name">No chat</div>
              <div class="chat-peer-sub" id="chat-peer-sub">Waiting...</div>
              <div class="chat-match-hint" id="chat-match-hint"></div>
            </div>
          </div>
          <button id="chat-block-user" class="secondary-btn" type="button">Block user</button>
        </div>

        <div class="chat-body" id="chat-messages"></div>
        <div class="chat-starters" id="chat-starters" style="display:none;"></div>

        <div class="chat-input">
          <button id="chat-attach" class="chat-tool-btn" type="button" title="Attach file">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16.5 6.5v9a4.5 4.5 0 1 1-9 0v-10a3 3 0 0 1 6 0v9a1.5 1.5 0 0 1-3 0V7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <input id="chat-file-input" type="file" hidden />
          <button id="chat-voice" class="chat-tool-btn" type="button" title="Record voice message">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M19 11a7 7 0 1 1-14 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <input id="chat-text" placeholder="Message..." autocomplete="off" />
          <button id="chat-send">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/storage.js"></script>
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/chat_page.js"></script>
</body>
</html>
