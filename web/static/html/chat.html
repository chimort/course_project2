<!-- web/static/chat.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chat</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/chat.css" />
</head>
<body>
  <div class="container" style="max-width: 1100px;">
    <div class="topbar">
      <h1>Chat</h1>
      <button id="chat-exit" class="ghost-btn">Back</button>
    </div>

    <div class="panel">
      <div class="chat-shell">
        <div class="chat-header">
          <div class="chat-peer">
            <div class="chat-peer-avatar" id="chat-peer-avatar">?</div>
            <div>
              <div class="chat-peer-name" id="chat-peer-name">No chat</div>
              <div class="chat-peer-sub" id="chat-peer-sub">Waiting...</div>
            </div>
          </div>
        </div>

        <div class="chat-body" id="chat-messages"></div>

        <div class="chat-input">
          <input id="chat-text" placeholder="Message..." autocomplete="off" />
          <button id="chat-send">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/storage.js"></script>
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/chat_page.js"></script>
</body>
</html>
