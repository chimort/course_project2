syntax = "proto3";

package chatpb;

option go_package = "github.com/chimort/course_project2/api/proto/chatpb";

import "google/api/annotations.proto";

service ChatService {

  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse) {
    option (google.api.http) = {
      post: "/v1/chat/create"
      body: "*"
    };
  };

  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {
    option (google.api.http) = {
      post: "/v1/chat/send"
      body: "*"
    };
  };

  rpc GetParticipants(GetParticipantsRequest) returns (GetParticipantsResponse) {
    option (google.api.http) = {
      get: "/v1/chat/{chat_id}/participants"
    };
  };

  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse) {
    option (google.api.http) = {
      get: "/v1/chat/{chat_id}/messages"
    };
  };

  rpc GetUserChats(GetUserChatsRequest) returns (GetUserChatsResponse) {
    option (google.api.http) = {
      get: "/v1/chat/history/{username}"
    };
  };

  rpc MarkChatRead(MarkChatReadRequest) returns (MarkChatReadResponse) {
    option (google.api.http) = {
      post: "/v1/chat/{chat_id}/read/{username}"
      body: "*"
    };
  };

  rpc SetChatMatchTags(SetChatMatchTagsRequest) returns (SetChatMatchTagsResponse) {
    option (google.api.http) = {
      post: "/v1/chat/{chat_id}/match-tags"
      body: "*"
    };
  };

  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse) {
    option (google.api.http) = {
      post: "/v1/chat/block"
      body: "*"
    };
  };

  rpc GetBlockStatus(GetBlockStatusRequest) returns (GetBlockStatusResponse) {
    option (google.api.http) = {
      get: "/v1/chat/block-status/{user1}/{user2}"
    };
  };

  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse) {
    option (google.api.http) = {
      post: "/v1/chat/unblock"
      body: "*"
    };
  };
}

message CreateChatRequest {
  string user1 = 1;
  string user2 = 2;
}

message CreateChatResponse {
  string chat_id = 1;
}

message SendMessageRequest {
  string chat_id = 1;
  string sender = 2;
  string content = 3;
}

message SendMessageResponse {
  bool ok = 1;
}

message GetParticipantsRequest {
  string chat_id = 1;
}

message GetParticipantsResponse {
  repeated string usernames = 1;
}

message GetMessagesRequest {
  string chat_id = 1;
  int32 limit = 2;
}

message ChatMessage {
  string sender = 1;
  string content = 2;
  string created_at = 3;
}

message GetMessagesResponse {
  repeated ChatMessage messages = 1;
}

message GetUserChatsRequest {
  string username = 1;
  string sort_by = 2;
  string filter_mode = 3;
  string filter_tag = 4;
  string peer_query = 5;
}

message ChatPreview {
  string chat_id = 1;
  string peer_username = 2;
  string last_message = 3;
  string last_message_at = 4;
  bool has_unread = 5;
  string match_hint = 6;
  repeated string match_tags = 7;
  string search_mode = 8;
}

message GetUserChatsResponse {
  repeated ChatPreview chats = 1;
}

message MarkChatReadRequest {
  string chat_id = 1;
  string username = 2;
}

message MarkChatReadResponse {
  bool ok = 1;
}

message SetChatMatchTagsRequest {
  string chat_id = 1;
  repeated string tags = 2;
  string search_mode = 3;
}

message SetChatMatchTagsResponse {
  bool ok = 1;
}

message BlockUserRequest {
  string blocker_username = 1;
  string blocked_username = 2;
}

message BlockUserResponse {
  bool ok = 1;
}

message GetBlockStatusRequest {
  string user1 = 1;
  string user2 = 2;
}

message GetBlockStatusResponse {
  bool is_blocked = 1;
  bool blocked_by_user1 = 2;
  bool blocked_by_user2 = 3;
}

message UnblockUserRequest {
  string blocker_username = 1;
  string blocked_username = 2;
}

message UnblockUserResponse {
  bool ok = 1;
}
